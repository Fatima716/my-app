name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: |
          Z=$(ls *.zip | head -1)
          echo "Using $Z"
          mkdir proj
          unzip -q "$Z" -d proj
      - name: Create Android project
        working-directory: proj
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp proj/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: proj/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: proj/android/app/build/outputs/apk/debug/app-debug.apk
